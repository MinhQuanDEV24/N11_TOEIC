spring:
  datasource:
    url: jdbc:h2:mem:${random.uuid};MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql,classpath:reading-schema-h2.sql
      data-locations: file:database/seed.sql,file:database/updates/002_quiz_modes.sql,file:database/updates/003_reading_part5.sql,file:database/updates/004_reading_part6.sql,file:database/updates/005_reading_part7.sql
      encoding: UTF-8
