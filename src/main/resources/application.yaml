spring:
  application:
    name: nhom11
  config:
    import:
      - "optional:file:./.env[.properties]"
      - "optional:file:./application-local.yaml"
      - "optional:file:./application-local.properties"
  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:n11_toeic}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${DB_USERNAME:${DB_USER:root}}
    password: ${DB_PASSWORD:}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
  sql:
    init:
      mode: always
      schema-locations: file:database/schema.sql

  mvc:
    view:
      prefix: /WEB-INF/views/
      suffix: .jsp

app:
  password-reset:
    base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}
    from: ${MAIL_FROM:noreply@n11toeic.local}

server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
    encoding:
      charset: UTF-8
      force: true
